<div class="container">
  <h2>Car List</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Car Name</th>
       <!-- <th>Price</th>-->
        <!--<th>Model</th> -->
       <!--Available</th>   -->
        <th>Image</th>
        <th>Edit Car</th>
        <th>Delete Car</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let car of cars" [routerLink]="['/cars', car.id]">
        <td>{{ car.id }}</td>
        <td>{{ car| carMiles | uppercase}}</td>
        <!--<td>{{ car.model | lowercase}}</td>-->
        <!--<td>{{ car.price | currency:'CAD' }}</td>-->
        <!--<td>{{ car.isAvailable ? 'Yes' : 'No' }}</td>-->
        <td><img [src]="car.image" alt="{{ car.carName }}" height="100" width="100" /></td>
        <td><button type="button" (click)="onEdit()" class="btn edit-btn">Edit</button></td>
        <td><button type="button" (click)="onDelete(car)" class="btn delete-btn">Delete</button></td>

      
      </tr>
    </tbody>
  </table>
</div>
