<div class="container">
  <h2>Car List</h2>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let car">{{ car.id }}</td>
    </ng-container>

    <ng-container matColumnDef="carName">
      <th mat-header-cell *matHeaderCellDef>Car Name</th>
      <td mat-cell *matCellDef="let car">{{ car | carMiles | uppercase }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let car">{{ car.price | currency:'CAD'  }}</td>
    </ng-container>



    <ng-container matColumnDef="model">
      <th mat-header-cell *matHeaderCellDef>Model</th>
      <td mat-cell *matCellDef="let car">{{ car.model | lowercase }}</td>
    </ng-container>

   
    <ng-container matColumnDef="isAvailable">
      <th mat-header-cell *matHeaderCellDef>Available</th>
      <td mat-cell *matCellDef="let car">{{ car.isAvailable ? 'Yes' : 'No' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
    <tr
      mat-row
      *matRowDef="let car; columns: displayColumns"
      [routerLink]="['/cars', car.id]"
      [appHoverHighlight]="'lightblue'"
    ></tr>


  </table>
  <div>
    <button type="button" (click)="onEdit()" class="btn edit-btn">EDIT</button>
  </div>
  <div>
    <button type="button" (click)="onDelete()" class="btn delete-btn">DELETE</button> <!-- Pass 'car' to delete -->
  </div>
</div>
