<form [formGroup]="carFomr"(ngSubmit)="onSubmit">

    <div class="form-group">
        <label for="id">ID</label>
        <input type="number" id="id" formControlNmae="id" />
    </div>

    <div class="form-group">
        <label for="carName">Car Name</label>
        <input type="text" id="firstName" formControlName="carName">
    </div>

    <div class="form-group">
        <label for="price">Car Price </label>
        <input type="number" id="price" formControlName="price" >
    </div>

    <div class="form-group">
        <label for="model">Model</label>
        <input type="text" id="model" formControlName="model" >
    </div>

    <div class="form-group">
        <label for="isAvailable">Is Available</label>
        <input type="checkbox" id="isAvailable" formControlName="isAvailable" >
    </div>

    <div class="form-group">
        <input type="button" (click)="onAdd()" class="btn add btn">
        <input type="button" (click)="onUpdate()" class="btn update-btn">
    </div>
</form>
