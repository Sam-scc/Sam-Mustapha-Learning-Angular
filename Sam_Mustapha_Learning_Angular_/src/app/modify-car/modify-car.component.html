<form [formGroup]="carForm"(ngSubmit)="onSubmit()" class="mat-form">

    <mat-form-field appearance="outline" class="form-field" disabled [appFocus]="'blue'">
        <mat-label>ID</mat-label>
        <input matInput type="number" formControlName="id" matTooltip = "add and id">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field" disabled [appFocus]="'blue'">
        <mat-label>Car Name</mat-label>
        <input matInput type="text" formControlName="carName" appAutoFocus matTooltip = "add car name">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field" disabled [appFocus]="'blue'">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" matTooltip = "add car price">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field" disabled [appFocus]="'blue'">
        <mat-label>Model</mat-label>
        <input matInput type="text" formControlName="Model" matTooltip = "add car model">
    </mat-form-field>
     

    <mat-checkbox formControlName="isAvailable" class="color" matTooltip = "check if needed">Is Available</mat-checkbox>

    <div class="form-buttons">
       <button type="button" (click)="onAdd()" class="btn add-btn">Add</button>
       <button type="button" (click)="onUpdate()" class="btn update-btn">Update</button>

    </div>
</form>
