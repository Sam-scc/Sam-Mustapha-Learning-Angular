<form [formGroup]="carForm"(ngSubmit)="onSubmit()">

    <div class="form-group">
        <label for="id">ID</label>
        <input type="number" id="id" formControlName="id"  [appFocus]="'darkgray'"/>
    </div>

    <div class="form-group">
        <label for="carName">Car Name</label>
        <input type="text" id="firstName" formControlName="carName"  [appFocus]="'darkgray'">
    </div>

    <div class="form-group">
        <label for="price">Car Price </label>
        <input type="number" id="price" formControlName="price"  [appFocus]="'darkgray'">
    </div>

    <div class="form-group">
        <label for="model">Model</label>
        <input type="text" id="model" formControlName="model"  [appFocus]="'darkgray'">
    </div>

    <div class="form-group">
        <label for="isAvailable">Is Available</label>
        <input type="checkbox" id="isAvailable" formControlName="isAvailable"  >
    </div>

    <div class="form-buttons">
       <button type="button" (click)="onAdd()" class="btn add-btn">Add</button>
       <button type="button" (click)="onUpdate()" class="btn update-btn">Update</button>

    </div>
</form>
